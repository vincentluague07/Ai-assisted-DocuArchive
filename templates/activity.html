{% extends "layout.html" %}

{% set active_page = 'activity' %}

{% block page_title %}Activity Logs{% endblock %}
{% block page_subtitle %}Audit trail and compliance records{% endblock %}

{% block page_content %}
<div class="activity-container">
    <div class="filters-bar">
        <select id="actionFilter" class="filter-select" data-testid="select-action-filter">
            <option value="">All Actions</option>
            <option value="upload">Upload</option>
            <option value="download">Download</option>
            <option value="view">View</option>
            <option value="update">Update</option>
            <option value="archive">Archive</option>
            <option value="restore">Restore</option>
            <option value="permanent_delete">Delete</option>
            <option value="search">Search</option>
            <option value="create">Create</option>
        </select>
        <select id="resourceFilter" class="filter-select" data-testid="select-resource-filter">
            <option value="">All Resources</option>
            <option value="document">Documents</option>
            <option value="category">Categories</option>
        </select>
    </div>
    
    <div class="activity-table-container">
        <table class="activity-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Resource</th>
                    <th>Details</th>
                    <th>IP Address</th>
                </tr>
            </thead>
            <tbody id="activityBody">
                <tr><td colspan="6" class="loading">Loading activity logs...</td></tr>
            </tbody>
        </table>
    </div>
    
    <div class="pagination" id="pagination">
    </div>
</div>

<script>
let currentPage = 1;

async function loadActivityLogs() {
    const actionFilter = document.getElementById('actionFilter').value;
    const resourceFilter = document.getElementById('resourceFilter').value;
    
    let url = `/api/activity?page=${currentPage}&limit=20`;
    if (actionFilter) url += `&action=${actionFilter}`;
    if (resourceFilter) url += `&resourceType=${resourceFilter}`;
    
    try {
        const response = await fetch(url);
        
        if (response.status === 403) {
            document.getElementById('activityBody').innerHTML = 
                '<tr><td colspan="6" class="error-state">Access denied. Admin privileges required.</td></tr>';
            return;
        }
        
        const data = await response.json();
        
        if (data.logs.length === 0) {
            document.getElementById('activityBody').innerHTML = 
                '<tr><td colspan="6" class="empty-state">No activity logs found</td></tr>';
            return;
        }
        
        document.getElementById('activityBody').innerHTML = data.logs.map(log => `
            <tr>
                <td class="time">${formatTime(log.createdAt)}</td>
                <td class="user">
                    <div class="user-cell">
                        ${log.user ? `
                            ${log.user.profileImageUrl ? 
                                `<img src="${log.user.profileImageUrl}" alt="" class="user-avatar-small">` : 
                                '<i class="fas fa-user user-avatar-small"></i>'}
                            <span>${escapeHtml(log.user.firstName || log.user.email || 'Unknown')}</span>
                        ` : '<span class="text-muted">System</span>'}
                    </div>
                </td>
                <td class="action">
                    <span class="action-badge ${log.action}">${formatAction(log.action)}</span>
                </td>
                <td class="resource">${log.resourceType || '-'}</td>
                <td class="details">${escapeHtml(formatDetails(log.details))}</td>
                <td class="ip">${log.ipAddress || '-'}</td>
            </tr>
        `).join('');
        
        renderPagination(data.total, data.pages, data.currentPage);
        
    } catch (error) {
        console.error('Failed to load activity logs:', error);
        document.getElementById('activityBody').innerHTML = 
            '<tr><td colspan="6" class="error-state">Failed to load activity logs</td></tr>';
    }
}

function formatTime(dateStr) {
    if (!dateStr) return '-';
    const date = new Date(dateStr);
    // Format in Manila timezone (GMT+8)
    return date.toLocaleString('en-PH', {
        timeZone: 'Asia/Manila',
        year: 'numeric',
        month: 'numeric',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    });
}

function formatDetails(details) {
    if (!details) return '-';
    
    // If it's already a string, return it
    if (typeof details === 'string') {
        // Try to parse if it looks like JSON
        try {
            const parsed = JSON.parse(details);
            return formatDetailsObject(parsed);
        } catch {
            return details;
        }
    }
    
    // If it's an object, format it
    if (typeof details === 'object') {
        return formatDetailsObject(details);
    }
    
    return String(details);
}

function formatDetailsObject(obj) {
    if (!obj) return '-';
    
    // Handle common detail fields
    const parts = [];
    
    if (obj.title) parts.push(`Title: ${obj.title}`);
    if (obj.filename) parts.push(`File: ${obj.filename}`);
    if (obj.query) parts.push(`Query: "${obj.query}"`);
    if (obj.documentTitle) parts.push(`Document: ${obj.documentTitle}`);
    if (obj.categoryName) parts.push(`Category: ${obj.categoryName}`);
    if (obj.action) parts.push(`Action: ${obj.action}`);
    if (obj.results !== undefined) parts.push(`Results: ${obj.results}`);
    if (obj.message) parts.push(obj.message);
    
    if (parts.length > 0) {
        return parts.join(', ');
    }
    
    // Fallback: show key-value pairs
    const entries = Object.entries(obj);
    if (entries.length === 0) return '-';
    
    return entries.map(([key, value]) => {
        if (value === null || value === undefined) return null;
        if (typeof value === 'object') return `${key}: [complex]`;
        return `${key}: ${value}`;
    }).filter(Boolean).join(', ') || '-';
}

function formatAction(action) {
    return action.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function renderPagination(total, pages, current) {
    if (pages <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
    }
    
    let html = '';
    
    if (current > 1) {
        html += `<button onclick="goToPage(${current - 1})" class="page-btn">Previous</button>`;
    }
    
    for (let i = 1; i <= pages; i++) {
        if (i === current) {
            html += `<button class="page-btn active">${i}</button>`;
        } else if (Math.abs(i - current) <= 2 || i === 1 || i === pages) {
            html += `<button onclick="goToPage(${i})" class="page-btn">${i}</button>`;
        } else if (Math.abs(i - current) === 3) {
            html += '<span class="page-ellipsis">...</span>';
        }
    }
    
    if (current < pages) {
        html += `<button onclick="goToPage(${current + 1})" class="page-btn">Next</button>`;
    }
    
    document.getElementById('pagination').innerHTML = html;
}

function goToPage(page) {
    currentPage = page;
    loadActivityLogs();
}

// Event listeners
document.getElementById('actionFilter').addEventListener('change', () => {
    currentPage = 1;
    loadActivityLogs();
});
document.getElementById('resourceFilter').addEventListener('change', () => {
    currentPage = 1;
    loadActivityLogs();
});

loadActivityLogs();
</script>
{% endblock %}
